name: Keep Istanbul House Price Prediction Alive

on:
  schedule:
    - cron: "*/14 6-22 * * *"
  workflow_dispatch: 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send request to Render app
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://istanbulhousepriceprediction.onrender.com)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -ne 200 ] && [ "$STATUS" -ne 301 ]; then
            echo "Warning: Application might be sleeping or returned $STATUS"
          fi
